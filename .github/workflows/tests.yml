name: Heyaa tests

on:
  pull_request:
  push:
    branches: [main, improve/phonk-renderer-v1, feat/edl-contract-m1a]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests/unit -v
