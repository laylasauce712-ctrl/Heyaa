name: Heyaa tests

on:
  pull_request:
  push:
    branches: [main, improve/phonk-renderer-v1, feat/edl-contract-m1a]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg for render smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate renderer syntax and settings JSON
        run: |
          python -m py_compile src/agent_director.py src/heyaa/agents.py
          python -m json.tool params.json > /dev/null
          bash -n scripts/install_realesrgan_linux.sh
          bash -n scripts/prepare_local_worktree.sh
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Run synthetic end-to-end render smoke test
        run: bash tests/integration/render_smoke.sh
