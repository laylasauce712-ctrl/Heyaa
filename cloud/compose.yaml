services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy cloud/.env.example to cloud/.env and configure it}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - heyaa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
    volumes:
      - heyaa-media:/data
    ports:
      - "${HEYAA_STORAGE_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${HEYAA_STORAGE_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/heyaa-media
        mc anonymous set none local/heyaa-media
        mc cors set local/heyaa-media /tmp/cors.xml
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-cors.xml:/tmp/cors.xml:ro
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile.api
    environment:
      HEYAA_CLOUD_API_TOKEN: ${HEYAA_CLOUD_API_TOKEN:?Configure HEYAA_CLOUD_API_TOKEN}
      HEYAA_ALLOWED_ORIGINS: ${HEYAA_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      HEYAA_DATABASE_URL: ${HEYAA_DATABASE_URL:?Configure HEYAA_DATABASE_URL}
      HEYAA_STORAGE_ENDPOINT_URL: http://minio:9000
      HEYAA_STORAGE_PUBLIC_ENDPOINT_URL: ${HEYAA_STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      HEYAA_STORAGE_REGION: us-east-1
      HEYAA_STORAGE_BUCKET: heyaa-media
      HEYAA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER}
      HEYAA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
    ports:
      - "${HEYAA_API_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: cloud/Dockerfile.worker
    environment:
      HEYAA_DATABASE_URL: ${HEYAA_DATABASE_URL:?Configure HEYAA_DATABASE_URL}
      HEYAA_STORAGE_ENDPOINT_URL: http://minio:9000
      HEYAA_STORAGE_REGION: us-east-1
      HEYAA_STORAGE_BUCKET: heyaa-media
      HEYAA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER}
      HEYAA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
      HEYAA_ENABLE_AI_UPSCALE: ${HEYAA_ENABLE_AI_UPSCALE:-0}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8g
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  heyaa-postgres:
  heyaa-media:
